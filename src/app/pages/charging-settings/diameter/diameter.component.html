<form
  [formGroup]="form"
  (ngSubmit)="save()"
  class="row g-3 d-flex justify-content-center"
>
  <div class="col-12">
    <div
      class="d-flex justify-content-between align-items-center border-bottom pb-2"
    >
      <h5 class="fw-bold">Basic Settings</h5>

      <div class="d-flex gap-2">
        <button
          class="btn btn-red"
          [disabled]="!isModified || chargingSetting.started"
        >
          {{ chargingSetting.id ? "Update" : "Create" }}
        </button>

        <button
          class="btn btn-sm btn-success"
          title="Start"
          type="button"
          (click)="openConfirmToggle(chargingSetting, 'diameter')"
          [disabled]="chargingSetting.started"
        >
          <i class="bx bx-play"></i>
        </button>

        <button
          class="btn btn-sm btn-danger"
          title="Stop"
          type="button"
          (click)="openConfirmToggle(chargingSetting, 'diameter')"
          [disabled]="!chargingSetting.started"
        >
          <i class="bx bx-pause"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="col-12">
    <app-form-section
      [form]="form"
      [config]="basicSection"
    ></app-form-section>
  </div>

  <div class="col-12" *ngIf="isCrudComponent">
    <app-form-section
      [form]="form"
      [config]="performanceSection"
    ></app-form-section>
  </div>

  <div class="col-12" *ngIf="isCrudComponent">
    <app-form-section
      [form]="form"
      [config]="retriesSection"
    ></app-form-section>
  </div>
</form>

<br />
<app-local-peer *ngIf="isDataLoaded" [localPeer]="chargingSetting.local_peer" [isDisabled]="chargingSetting.started"
  (localPeerChange)="updateLocalPeer($event)" />

<br />
<app-parameters *ngIf="isDataLoaded" [parameters]="chargingSetting.parameters" [isDisabled]="chargingSetting.started"
  (parametersChange)="updateParameters($event)" />

<br />
<app-peer *ngIf="isDataLoaded" [peers]="peers" (peersChange)="updatePeers($event)"
  (peerToggleRequest)="openConfirmToggle($event, 'peer')" [isDisabled]="chargingSetting.started" />

<br />
<app-realms *ngIf="isDataLoaded" [realms]="realms" [isDisabled]="chargingSetting.started"
  (realmsChange)="updateRealms($event)" />

<div class="modal fade" tabindex="-1" role="dialog" id="modalConfirmToggle" data-bs-backdrop="static"
  aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <app-modal-delete [mensaje]="messageShow" (confirmAction)="onConfirmToggle($event)"></app-modal-delete>
  </div>
</div>
