<div class="row align-items-center g-2 mb-2">
  <div class="col-md-3">
    <div class="input-group plmn-search">
      <input type="search" class="form-control" placeholder="Search..." aria-label="Search networks" (input)="onSearchInput($event)">
      <span class="input-group-text"><i class="bx bx-search" aria-hidden="true"></i></span>
    </div>
  </div>
  <div class="col-md-9 d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-red" (click)="createNetwork()">
      <i class="bx bx-plus" aria-hidden="true"></i>
      Create
    </button>
    <button type="button" class="btn btn-red" (click)="refresh()" title="Refresh networks">
      <i class="bx bx-refresh" aria-hidden="true"></i>
    </button>
  </div>
</div>

<div class="table-responsive">
  <table class="table" style="width: 100%;" datatable [dtOptions]="dtOptions">
    <thead>
      <tr>
        <th>MCCMNC</th>
        <th>Network</th>
        <th>Country</th>
        <th>Country ISO</th>
        <th>Prefixes</th>
        <th class="align-center">Actions</th>
      </tr>
    </thead>
  </table>
</div>

<div class="modal fade" tabindex="-1" role="dialog" id="plmnNetworkModal" data-bs-backdrop="static" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <app-plmn-network-form [network]="selectedNetwork" (closeModal)="closeForm($event)"></app-plmn-network-form>
  </div>
</div>

<div class="modal fade" tabindex="-1" role="dialog" id="deletePlmnNetworkModal" data-bs-backdrop="static" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <app-modal-delete [mensaje]="deleteMessage" (confirmAction)="closeDelete($event)"></app-modal-delete>
  </div>
</div>
