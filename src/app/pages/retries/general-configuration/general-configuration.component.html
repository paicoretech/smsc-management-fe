<form
  [formGroup]="form"
  (ngSubmit)="save()"
  class="row g-3 d-flex justify-content-center"
>
  <div class="col-12">
    <app-form-section
      [form]="form"
      [config]="sectionConfig"
    >
    </app-form-section>
  </div>

  <div class="col-12 d-flex justify-content-end mt-3">
    <button
      type="submit"
      class="btn btn-red"
      [disabled]="form.invalid || form.disabled || isLoading || isSaving"
    >
      {{ isSaving ? 'Saving...' : 'Save' }}
    </button>
  </div>
</form>
