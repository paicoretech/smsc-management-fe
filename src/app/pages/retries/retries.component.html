<div class="content-wrapper ps-2 pe-2">
  <div class="container-fluid flex-grow-1 container-p-y">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <i
          class="bx bx-refresh"
          aria-hidden="true"
          style="font-size: 40px; color: #7b3031;"
        ></i>

        <label
          class="card-header title-content mb-0 ml-2"
          style="font-size: 20px; font-weight: 500; padding-bottom: 10px;"
        >
          Retries
        </label>
      </div>
    </div>

    <div class="ps-3 pe-3 pb-4 mt-2 bg-white">
      <ul
        class="nav nav-tabs mt-4"
        role="tablist"
        aria-label="Retry configuration sections"
      >
        <li class="nav-item" role="presentation">
          <a
            class="nav-link"
            role="tab"
            routerLink="./general-configuration"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            General Configuration
          </a>
        </li>

        <li class="nav-item" role="presentation">
          <a
            class="nav-link"
            role="tab"
            routerLink="./retry-profiles"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Retry Profiles
          </a>
        </li>

        <li class="nav-item" role="presentation">
          <a
            class="nav-link"
            role="tab"
            routerLink="./routing-retry-profiles"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Routing Retry Profile
          </a>
        </li>
      </ul>

      <div class="pt-4">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
