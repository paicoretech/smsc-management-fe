<div class="form-group row mb-2">
  <div [class]="labelCol + ' label'">
    <label>
      {{ label }}
    </label>
    <i
      *ngIf="tooltip"
      class="bx bx-info-circle check_form"
      tabindex="0"
      [title]="tooltip"
      [checkFormTooltip]="tooltip"
      [attr.aria-label]="tooltip"
    ></i>
  </div>

  <div [class]="inputCol">
    <input
      type="checkbox"
      class="form-check-input check_form"
      [formControl]="control"
    />
  </div>
</div>
